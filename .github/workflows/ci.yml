name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The ubuntu-latest image ships the Android SDK with ANDROID_HOME set and licenses
      # accepted; android-actions/setup-android@v3 is EOL and failed on every run.
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test receiver
        run: python -m unittest discover -s receiver/tests -v

      - name: Build and test Android app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: privagent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
